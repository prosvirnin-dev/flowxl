[project]
name = "flowxl"
version = "0.1.0"
description = "Predictable Excel writing over openpyxl"
readme = "README.md"
authors = [
    { name = "Aleksandr Prosvirnin", email = "prosvirnin.a@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
pandas = ["pandas>=2.2"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
exclude = [
  ".git",
  "__pycache__",
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E203",
]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
